[package]
name = "aktor-remote"
description = "Typed Aktor calls to independently running services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"

[features]
default = ["testing"]
testing = ["aktor/testing"]
serde = ["aktor/serde"]
udp = ["dep:utp", "dep:tokio-util"]

[target.'cfg(unix)'.dependencies]
aktor = { version = "=0.0.9", path = "../aktor", default-features = false, features = ["macros", "tokio", "transport"] }
tokio = { workspace = true, features = ["net", "io-util", "rt", "time"] }
serde.workspace = true
postcard.workspace = true
lz4_flex.workspace = true
futures-core.workspace = true
getrandom.workspace = true
utp = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
aktor = { version = "=0.0.9", path = "../aktor", default-features = false, features = ["serde"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "test-util"] }
tempfile.workspace = true

[lints]
workspace = true

[lib]
doctest = false

