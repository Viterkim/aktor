[package]
license.workspace = true
name = "aktor-worker-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aktor = { workspace = true, features = ["macros", "wasm_browser_workers", "tokio", "browser_local", "bevy"] }
serde.workspace = true
serde_json.workspace = true
futures-util = { workspace = true, default-features = true }
rusqlite.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
gloo-timers.workspace = true
bevy_tasks.workspace = true
tokio = { workspace = true, features = ["sync"] }
sqlite-wasm-rs.workspace = true
sqlite-wasm-vfs.workspace = true

[features]
wrong-role = []
