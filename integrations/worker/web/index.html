<!doctype html>
<meta charset="utf-8" />
<title>aktor worker proof</title>
<p>Worker owns SQLite. Open the console to try window.client.read('volume').</p>
<script type="module">
    import init, {
        Client,
        sqlite_listener_check,
        group_check,
        closure_check,
        cancel_startup_check,
        cancel_configured_check,
        live_sessions_check,
        group_listener_check,
        group_startup_check,
        registration_check,
        typed_setup_check,
        serialization_shutdown_check,
        local_setup_check,
        remote_setup_check,
        remote_preflight_check,
        bevy_setup_check
    } from './pkg/aktor_worker_proof.js';

    await init();

    window.bevySetupCheck = bevy_setup_check;
    window.localSetupCheck = local_setup_check;
    window.remoteSetupCheck = remote_setup_check;
    window.remotePreflightCheck = remote_preflight_check;
    window.Client = Client;
    window.sqliteListenerCheck = sqlite_listener_check;
    window.groupCheck = group_check;
    window.closureCheck = closure_check;
    window.cancelStartupCheck = cancel_startup_check;
    window.cancelConfiguredCheck = cancel_configured_check;
    window.liveSessionsCheck = live_sessions_check;
    window.groupListenerCheck = group_listener_check;
    window.groupStartupCheck = group_startup_check;
    window.registrationCheck = registration_check;
    window.typedSetupCheck = typed_setup_check;
    window.serializationShutdownCheck = serialization_shutdown_check;

    window.client = new Client(new URL('./worker.js', location.href).href);
    window.setup = JSON.parse(await window.client.ready());
    window.ready = true;
</script>
