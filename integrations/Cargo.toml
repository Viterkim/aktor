[workspace]
resolver = "3"
members = ["renamed", "worker", "embassy", "wasm", "native"]

[workspace.package]
license = "MIT-0"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
aktor = { path = "../aktor", default-features = false }
er = { version = "0.7", default-features = false }
tokio = "1.53.1"
bevy_tasks = { version = "0.19", features = ["multi_threaded"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
rusqlite = "0.40"
embassy-time = "0.5"
embassy-time-driver = "0.2"
embassy-sync = "0.8"
embassy-executor = "0.10"
critical-section = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }
sqlite-wasm-rs = "0.5"
sqlite-wasm-vfs = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
