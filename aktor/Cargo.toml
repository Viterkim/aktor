[package]
license.workspace = true
readme.workspace = true
repository.workspace = true
name = "aktor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Actors with normal typed functions"
keywords = ["actor", "async", "concurrency", "tokio"]
categories = ["asynchronous", "concurrency"]

[package.metadata.docs.rs]
all-features = true

[lib]
doctest = false

[features]
default = ["macros"]
macros = ["dep:aktor-macros"]
std = []
tokio = ["std", "dep:tokio", "dep:parking_lot", "dep:futures-util"]
embassy = ["dep:embassy-sync"]
worker = ["std", "dep:tokio", "dep:serde", "dep:serde_json", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys", "dep:gloo-timers"]

[dependencies]
aktor-macros = { version = "=0.0.2", path = "../aktor-macros", optional = true }
er = { version = "0.6", default-features = false, features = ["macros"] }
parking_lot = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
embassy-sync = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
web-sys = { version = "0.3", features = ["Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "DedicatedWorkerGlobalScope"], optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["net", "time"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "rt-multi-thread"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints]
workspace = true

[[example]]
name = "tokio_connection"
required-features = ["macros", "tokio"]

[[example]]
name = "sqlite"
required-features = ["macros", "tokio"]

[[example]]
name = "guide"
required-features = ["macros", "tokio"]

[[test]]
name = "async"
required-features = ["macros", "tokio"]

[[test]]
name = "functions"
path = "tests/functions/main.rs"
required-features = ["macros", "tokio"]

[[test]]
name = "fatal"
path = "tests/fatal/main.rs"
required-features = ["tokio"]

[[test]]
name = "runtime"
path = "tests/runtime/main.rs"
required-features = ["tokio"]

[[test]]
name = "split"
path = "tests/split/main.rs"
required-features = ["macros", "tokio"]
