[package]
license.workspace = true
readme.workspace = true
repository.workspace = true
name = "aktor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Actors with normal typed functions"
keywords = ["actor", "async", "concurrency", "tokio"]
categories = ["asynchronous", "concurrency"]

[package.metadata.docs.rs]
all-features = true

[lib]
doctest = false

[features]
default = ["macros"]
macros = ["dep:aktor-macros"]
std = []
tokio = [
    "std", "dep:tokio", "dep:parking_lot", "dep:futures-util", "dep:rustix",
    "tokio?/rt", "tokio?/time",
    "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:gloo-timers",
]
std_thread = ["std", "dep:tokio", "dep:parking_lot", "dep:futures-util", "dep:rustix", "dep:futures-timer"]
bevy = ["browser_local", "std_thread", "dep:bevy-tasks", "dep:bevy-platform"]
local = ["dep:futures-core"]
embassy = ["local", "dep:embassy-time"]
embassy_cross_core = ["embassy", "dep:embassy-sync", "dep:portable-atomic", "dep:portable-atomic-util"]
browser_local = [
    "std", "local", "dep:tokio", "dep:futures-util", "dep:rustix",
    "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:gloo-timers",
]
wasm_browser_workers = [
    "std", "local", "dep:tokio", "tokio?/rt", "tokio?/time", "dep:futures-util", "dep:rustix",
    "dep:serde", "dep:postcard", "dep:inventory",
    "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys", "dep:gloo-timers",
]

[dependencies]
aktor-macros = { workspace = true, optional = true }
er.workspace = true
pin-project-lite.workspace = true
parking_lot = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
bevy-tasks = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }
portable-atomic-util = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
bevy-platform = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy-tasks = { workspace = true, features = ["multi_threaded"], optional = true }
futures-timer = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[dev-dependencies]
postcard.workspace = true
er = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["time", "rt-multi-thread", "signal", "test-util"] }
rusqlite.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
embassy-time = { workspace = true, features = ["std", "generic-queue-8"] }
critical-section = { workspace = true, features = ["std"] }

[lints]
workspace = true

[[example]]
name = "tokio_connection"
required-features = ["macros", "tokio"]

[[example]]
name = "sqlite"
required-features = ["macros", "tokio"]

[[example]]
name = "guide"
required-features = ["macros", "tokio"]

[[example]]
name = "group"
required-features = ["macros", "tokio"]

[[example]]
name = "counter"
required-features = ["macros", "tokio"]

[[test]]
name = "async"
required-features = ["macros", "tokio"]

[[test]]
name = "functions"
path = "tests/functions/main.rs"
required-features = ["macros", "tokio"]

[[test]]
name = "fatal"
path = "tests/fatal/main.rs"
required-features = ["tokio"]

[[test]]
name = "runtime"
path = "tests/runtime/main.rs"
required-features = ["tokio"]

[[test]]
name = "split"
path = "tests/split/main.rs"
required-features = ["macros", "tokio"]
