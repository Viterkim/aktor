[package]
license.workspace = true
readme.workspace = true
repository.workspace = true
name = "aktor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Actors with normal typed functions"
keywords = ["actor", "async", "concurrency", "tokio"]
categories = ["asynchronous", "concurrency"]

[package.metadata.docs.rs]
all-features = true

[lib]
doctest = false

[features]
default = ["macros"]
macros = ["dep:aktor-macros"]
std = []
tokio = [
    "std", "dep:tokio", "dep:parking_lot", "dep:futures-util", "dep:rustix",
    "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:gloo-timers",
]
embassy = ["dep:embassy-time", "dep:futures-core"]
wasm_browser_workers = [
    "std", "dep:tokio", "dep:futures-util", "dep:rustix",
    "dep:serde", "dep:postcard", "dep:inventory",
    "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys", "dep:gloo-timers",
]

[dependencies]
aktor-macros = { version = "=0.0.3", path = "../aktor-macros", optional = true }
er = { version = "0.6", default-features = false, features = ["macros"] }
pin-project-lite = { workspace = true }
parking_lot = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
futures-core = { version = "0.3", default-features = false, optional = true }
embassy-time = { version = "0.5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
inventory = { version = "0.3", optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
postcard = { version = "1.1", default-features = false, features = ["alloc"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-timers = { version = ">=0.3, <0.5", features = ["futures"], optional = true }
web-sys = { version = "0.3", features = ["Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "DedicatedWorkerGlobalScope"], optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["net", "time"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process"], optional = true }

[dev-dependencies]
er = { version = "0.6", default-features = false, features = ["serde"] }
tokio = { workspace = true, features = ["time", "rt-multi-thread", "signal"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints]
workspace = true

[[example]]
name = "tokio_connection"
required-features = ["macros", "tokio"]

[[example]]
name = "sqlite"
required-features = ["macros", "tokio"]

[[example]]
name = "guide"
required-features = ["macros", "tokio"]

[[test]]
name = "async"
required-features = ["macros", "tokio"]

[[test]]
name = "functions"
path = "tests/functions/main.rs"
required-features = ["macros", "tokio"]

[[test]]
name = "fatal"
path = "tests/fatal/main.rs"
required-features = ["tokio"]

[[test]]
name = "runtime"
path = "tests/runtime/main.rs"
required-features = ["tokio"]

[[test]]
name = "split"
path = "tests/split/main.rs"
required-features = ["macros", "tokio"]

[[example]]
name = "group"
required-features = ["macros", "tokio"]

[[example]]
name = "counter"
required-features = ["macros", "tokio"]
